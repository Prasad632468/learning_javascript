<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .container {
      width: 450px;
      border: 1px solid rgba(107, 106, 106, 0.301);
      border-radius: 15px;
      height: auto;
      background-color: rgba(241, 240, 239, 0.215);
      margin-top: 30px;
      padding-bottom: 20px;
    }
  </style>
</head>
<body>

<form id="contactform" onsubmit="return validate()">
  <div class="container">
    <h1 class="text-center mt-3">Contact Us</h1>

    <!-- Name -->
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" class="form-control" id="name">
      <span class="text-danger" id="nameError"></span>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="text" class="form-control" id="email">
      <span class="text-danger" id="emailError"></span>
    </div>

    <!-- Password -->
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" id="password">
      <span class="text-danger" id="passwordError"></span>
    </div>

    <!-- Confirm Password -->
    <div class="mb-3">
      <label class="form-label">Confirm Password</label>
      <input type="password" class="form-control" id="confirmPassword">
      <span class="text-danger" id="confirmError"></span>
    </div>

    <!-- Mobile -->
    <div class="mb-3">
      <label class="form-label">Mobile Number</label>
      <input type="number" class="form-control" id="mobile">
      <span class="text-danger" id="mobileError"></span>
    </div>

    <!-- Gender -->
    <div class="mb-3">
      <label>Gender</label><br>
      <input type="radio" name="gender" value="male"> Male
      <input type="radio" name="gender" value="female"> Female
      <input type="radio" name="gender" value="other"> Other
      <br>
      <span class="text-danger" id="genderError"></span>
    </div>

    <!-- Checkbox -->
    <div class="mb-3">
      <input type="checkbox" id="check">
      <label>I agree to terms and conditions</label>
      <span class="text-danger" id="checkError"></span>
    </div>

    <!-- Message -->
    <div class="form-floating mb-2">
      <textarea class="form-control" id="msg" style="height: 100px"></textarea>
      <label>Comments</label>
      <span class="text-danger" id="msgError"></span>
    </div>

    <button type="submit" class="btn btn-primary w-100">Submit</button>
  </div>
</form>

<script>
function validate() {
  
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();
  const confirmPassword = document.getElementById("confirmPassword").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const msg = document.getElementById("msg").value.trim();
  const gender = document.querySelector('input[name="gender"]:checked');
  const check = document.getElementById("check").checked;

  const nameError = document.getElementById("nameError");
  const emailError = document.getElementById("emailError");
  const passwordError = document.getElementById("passwordError");
  const confirmError = document.getElementById("confirmError");
  const mobileError = document.getElementById("mobileError");
  const genderError = document.getElementById("genderError");
  const checkError = document.getElementById("checkError");
  const msgError = document.getElementById("msgError");

  nameError.textContent = "";
  emailError.textContent = "";
  passwordError.textContent = "";
  confirmError.textContent = "";
  mobileError.textContent = "";
  genderError.textContent = "";
  checkError.textContent = "";
  msgError.textContent = "";

  let isValid = true;

  if (name === "") {
    nameError.textContent = "Please enter your name";
    isValid = false;
  } else if (name.length < 3) {
    nameError.textContent = "Name must be at least 3 characters";
    isValid = false;
  }

  if (email === "") {
    emailError.textContent = "Please enter email";
    isValid = false;
  } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    emailError.textContent = "Enter valid email";
    isValid = false;
  }

  if (password === "") {
    passwordError.textContent = "Please enter password";
    isValid = false;
  } else if (!/^(?=.[a-z])(?=.[A-Z])(?=.\d)(?=.[@.#$!%*?&]).{8,15}$/.test(password)) {
    passwordError.textContent = "Password must include A-Z, a-z, number & symbol";
    isValid = false;
  }

  if (confirmPassword === "" || confirmPassword !== password) {
    confirmError.textContent = "Password does not match";
    isValid = false;
  }

  if (mobile === "" || !/^\d{10}$/.test(mobile)) {
    mobileError.textContent = "Enter valid 10-digit mobile number";
    isValid = false;
  }

  if (!gender) {
    genderError.textContent = "Please select gender";
    isValid = false;
  }

  if (!check) {
    checkError.textContent = "Please agree to terms";
    isValid = false;
  }

  if (msg === "") {
    msgError.textContent = "Please enter message";
    isValid = false;
  }

  if (isValid) {
    alert("Form submitted successfully!");
  }

  return isValid;
}
</script>

</body>
</html>
